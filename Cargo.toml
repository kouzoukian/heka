[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kouzoukian/heka"
publish = false

[workspace.dependencies]
embed-resource = "=3.0.12"
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-component = "=0.11.0"
gpui-kit-assets = "=0.11.0"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14" }
hidapi = "=2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "=0.25.1"
vigem-rust = "=0.2.1"
windows = "=0.62.2"
windows-sys = "=0.61.2"
raw-window-handle = "=0.6.2"
heka-core = { path = "crates/heka-core" }
heka-windows = { path = "crates/heka-windows" }

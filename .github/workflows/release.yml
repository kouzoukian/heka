name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: heka
          save-if: false
      - name: Test
        run: cargo test --workspace --locked
      - name: Package
        run: cargo run -p heka-package --locked -- --tag "$env:GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "target/dist/heka-$env:GITHUB_REF_NAME-windows-x64.zip"
          $flags = @("--verify-tag", "--generate-notes", "--title", "heka $env:GITHUB_REF_NAME")
          if ($env:GITHUB_REF_NAME.Contains("-")) { $flags += "--prerelease" }
          gh release create $env:GITHUB_REF_NAME $zip @flags
